# Habilita el uso de librerías AndroidX en vez de las legacy android.support.*
# Requerido: sin esto, Gradle no puede resolver ninguna dependencia androidx.* (Room, Hilt, Navigation, etc.)
android.useAndroidX=true

# Evita generar clases R transitivas duplicadas entre módulos (buena práctica, mejora tiempos de build)
android.nonTransitiveRClass=true

# Tamaño de heap de la JVM para el proceso de Gradle (evita OutOfMemory en builds con Room/Hilt/KSP)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Ejecuta tareas en paralelo cuando es posible (builds más rápidos)
org.gradle.parallel=true

# Habilita el cache de configuración de Gradle (builds incrementales más rápidos)
org.gradle.caching=true

# Kotlin usa el compilador oficial en modo incremental
kotlin.code.style=official
